async function doLogout(){if(!confirm('লগআউট করলে এই ফোন থেকে অ্যাপের তথ্য মুছে যাবে (অনলাইনে নিরাপদ থাকবে)। চালিয়ে যাবেন?'))return;await sync();if(lastErr)return alert('সিঙ্ক সম্পূর্ণ হয়নি, তাই লগআউট করা গেল না। ইন্টারনেট দেখে আবার চেষ্টা করুন।');await sb.auth.signOut();localStorage.removeItem(K);localStorage.removeItem('khamar_ctx');location.reload()}
const acctHTML=()=>`<div class="c"><b>অ্যাকাউন্ট ও সিঙ্ক</b><div class="k">${BID?esc(UEMAIL)+' · ভূমিকা: '+ROLE+' · '+esc($('#sy').textContent):'অনলাইনে সংযুক্ত নয় (তথ্য শুধু এই ফোনে)'}</div>${BID?`<button class="btn" onclick="sync().then(()=>draw())">এখনই সিঙ্ক করুন</button>${ROLE=='admin'?'<button class="btn s" onclick="addPartner()">+ পার্টনার/সদস্য যোগ করুন</button>':''}<button class="btn s" onclick="doLogout()">লগআউট</button>`:'<button class="btn" onclick="showAuth()">লগইন / সাইন আপ</button>'}</div>`;
async function boot(){if(typeof supabase=='undefined'){setSy('অফলাইন (শুধু ফোনে)');return}sb=supabase.createClient(SBU,SBK);try{const{data}=await sb.auth.getSession();if(data.session)afterLogin(data.session.user);else showAuth()}catch(e){setSy('অফলাইন')}
setInterval(()=>{if(!document.hidden)sync()},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});addEventListener('online',sync)}
draw();boot();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
